<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 6" width="100%" height="6">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0)" />
      <stop offset="30%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1" />
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0)" />
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="2" width="1000" height="2" fill="url(#divGrad)" filter="url(#divGlow)" />
</svg>